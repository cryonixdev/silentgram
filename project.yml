name: SilentGram
options:
  bundleIdPrefix: com.silentgram
  deploymentTarget:
    iOS: "16.0"
packages:
  TDLibFramework:
    url: https://github.com/Swiftgram/TDLibFramework
    branch: main
targets:
  SilentGram:
    type: application
    platform: iOS
    sources: [SilentGram]
    dependencies:
      - package: TDLibFramework
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.silentgram.app
        PRODUCT_NAME: SilentGram
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Silent Gram"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        OTHER_LDFLAGS: "$(inherited) -lc++ -lz"
        CODE_SIGNING_ALLOWED: NO
