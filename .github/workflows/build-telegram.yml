name: Build Silent Gram (Telegram)

# Настоящий интерфейс Telegram: собираем Swiftgram (открытый форк Telegram-iOS)
# с нашим патчем режима призрака из папки swiftgram/.

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Check keys
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          if [ -z "$TG_API_ID" ] || [ -z "$TG_API_HASH" ]; then
            echo "::error::Нет секретов TG_API_ID / TG_API_HASH"; exit 1
          fi

      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf ~/Library/Android /usr/local/share/dotnet /usr/local/lib/android \
            ~/.dotnet ~/.ghcup /opt/hostedtoolcache/CodeQL || true
          xcrun simctl delete all || true
          sudo rm -rf ~/Library/Developer/CoreSimulator/Caches || true
          df -h /

      - name: Select Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode_27*.app | sort -V | tail -1)
          [ -z "$XCODE" ] && XCODE=/Applications/Xcode.app
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Get Swiftgram source
        run: |
          SRC=/Users/Shared/telegram-ios
          sudo mkdir -p /Users/Shared && sudo chown $(whoami) /Users/Shared
          git init -q $SRC && cd $SRC
          git remote add origin https://github.com/Swiftgram/Telegram-iOS.git
          git fetch -q --depth 1 origin $(cat $GITHUB_WORKSPACE/swiftgram/COMMIT)
          git checkout -q FETCH_HEAD
          git submodule update --init --recursive --depth 1 -j 8 || git submodule update --init --recursive -j 8
          git apply --verbose $GITHUB_WORKSPACE/swiftgram/*.patch
          df -h /

      - name: Write configuration
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          cat > /Users/Shared/silentgram-configuration.json <<EOF
          {
            "sg_config": "",
            "bundle_id": "ph.telegra.Telegraph",
            "api_id": "${TG_API_ID}",
            "api_hash": "${TG_API_HASH}",
            "team_id": "C67CF9S4VU",
            "app_center_id": "0",
            "is_internal_build": "false",
            "is_appstore_build": "true",
            "appstore_id": "686449807",
            "app_specific_url_scheme": "tg",
            "premium_iap_product_id": "org.telegram.telegramPremium.monthly",
            "enable_siri": false,
            "enable_icloud": false
          }
          EOF

      - name: Build
        run: |
          set -o pipefail
          cd /Users/Shared/telegram-ios
          # Профили Swiftgram просрочены — переподписываем с новым сроком
          python3 $GITHUB_WORKSPACE/swiftgram/refresh_profiles.py /Users/Shared/telegram-ios /Users/Shared/codesigning
          python3 build-system/Make/ImportCertificates.py --path /Users/Shared/codesigning/certs
          python3 -u build-system/Make/Make.py \
            --overrideXcodeVersion \
            --bazelUserRoot="/private/var/tmp/_bazel_silentgram" \
            build \
            --configurationPath=/Users/Shared/silentgram-configuration.json \
            --codesigningInformationPath=/Users/Shared/codesigning \
            --configuration=release_arm64 \
            --buildNumber=1 2>&1 | tee $GITHUB_WORKSPACE/build.log

      - name: Show errors
        if: failure()
        run: |
          echo "===== ошибки ====="
          grep -E "error:|ERROR:|Error:" $GITHUB_WORKSPACE/build.log | grep -v "^INFO" | sort -u | head -60 || true
          echo "===== конец лога ====="
          tail -80 $GITHUB_WORKSPACE/build.log || true
          df -h /

      - name: Package IPA
        run: |
          cd /Users/Shared/telegram-ios
          IPA=$(ls bazel-out/*/bin/Telegram/*.ipa | grep -v -i watch | head -1)
          echo "IPA: $IPA"
          rm -rf /tmp/pkg && mkdir /tmp/pkg && cd /tmp/pkg
          unzip -q "$OLDPWD/$IPA"
          APP=$(ls -d Payload/*.app | head -1)
          echo "APP: $APP"
          # Бесплатный Apple ID не потянет расширения — убираем их
          rm -rf $APP/PlugIns $APP/Watch $APP/Extensions
          plutil -replace CFBundleDisplayName -string "Silent Gram" $APP/Info.plist
          for f in $APP/*.lproj/InfoPlist.strings; do plutil -remove CFBundleDisplayName "$f" 2>/dev/null || true; done
          zip -qry $GITHUB_WORKSPACE/SilentGram-Telegram.ipa Payload
          ls -la $GITHUB_WORKSPACE/SilentGram-Telegram.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: SilentGram-Telegram-ipa
          path: SilentGram-Telegram.ipa

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: telegram-build-log
          path: build.log
