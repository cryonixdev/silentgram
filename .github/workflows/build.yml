name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Write API keys
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          if [ -z "$TG_API_ID" ] || [ -z "$TG_API_HASH" ]; then
            echo "::error::Добавь секреты TG_API_ID и TG_API_HASH в Settings → Secrets and variables → Actions"
            exit 1
          fi
          cat > SilentGram/Secrets.swift <<EOF
          enum Secrets {
              static let apiId: Int = ${TG_API_ID}
              static let apiHash: String = "${TG_API_HASH}"
          }
          EOF

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project SilentGram.xcodeproj \
            -scheme SilentGram \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | grep -E "error:|\*\* BUILD" || true
          if [ ! -f build/Build/Products/Release-iphoneos/SilentGram.app/SilentGram ]; then
            echo "::error::Сборка не удалась. Ошибки:"
            grep -iE "error" build.log | sort -u | head -40
            echo "----- последние строки лога -----"
            tail -60 build.log
            exit 1
          fi

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/SilentGram.app Payload/
          zip -qry SilentGram.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: SilentGram-ipa
          path: SilentGram.ipa

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log
